[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/"
  to = "/home.html"
  status = 200
  force = true

[[redirects]]
  from = "/diy"
  to = "/diy.html"
  status = 200
  force = true

[[redirects]]
  from = "/diy/"
  to = "/diy.html"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  VITE_AGENTS_API_URL = "https://ccc-agents-api.onrender.com"

[functions]
  node_bundler = "esbuild"

# Live Fieldwork audits exceed the default 30s local/sync cap.
# Background worker does the Anthropic pass (up to 15 minutes).
[functions."fieldwork-audit-run"]
  timeout = 26

[functions."fieldwork-audit-run-background"]
  timeout = 900

[functions."fieldwork-generate-letter"]
  timeout = 60

[functions."daily-cron"]
  schedule = "0 15 * * *"

# public-affiliate-lookup is public, unauthenticated, and read-only — unlike
# public-intake.cjs (which has its own app-level honeypot + DB-tracked IP
# throttle) this one has no protection at all against being hammered, or
# used to enumerate affiliate ref-code prefixes one character at a time.
[functions."public-affiliate-lookup"]
  [functions."public-affiliate-lookup".rate_limit]
    window = "1m"
    limit = 30

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP: allow scripts/styles from self + Supabase + Google Fonts only.
    # 'unsafe-inline' is required for React's inline styles; no eval is allowed.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://assets.calendly.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; media-src 'self' https:; connect-src 'self' https://*.supabase.co https://*.supabase.com https://api.anthropic.com https://generativelanguage.googleapis.com https://ccc-agents-api.onrender.com; frame-src 'self' https://calendly.com; object-src 'none'; base-uri 'self';"

# /join is a public, no-auth, no-sensitive-data lead-capture page meant to be
# embedded on affiliate sites (starting with FundHub) — it needs its own,
# more permissive framing policy instead of inheriting the app-wide
# X-Frame-Options: DENY above. frame-ancestors '*' here takes precedence over
# the inherited X-Frame-Options in every modern browser (CSP wins when both
# are present), so DENY never actually applies to this path — no change to
# framing protection anywhere else in the app.
[[headers]]
  for = "/join*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://assets.calendly.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; media-src 'self' https:; connect-src 'self' https://*.supabase.co https://*.supabase.com; frame-src 'self' https://calendly.com; frame-ancestors *; object-src 'none'; base-uri 'self';"
