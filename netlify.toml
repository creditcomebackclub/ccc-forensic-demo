[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/"
  to = "/site-live/index.html"
  status = 200
  force = true

# The approved design is emitted separately for owner review and live marketing.
# /new-site-preview remains inert; only the root live artifact can create leads.
[[redirects]]
  from = "/new-site-preview"
  to = "/site-preview/index.html"
  status = 200

[[redirects]]
  from = "/new-site-preview/"
  to = "/site-preview/index.html"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/affiliate/apply"
  to = "/affiliate-apply.html"
  status = 200

[[redirects]]
  from = "/affiliate/apply/"
  to = "/affiliate-apply.html"
  status = 200

[[redirects]]
  from = "/cancellation-refund-policy"
  to = "/cancellation-refund-policy.html"
  status = 200

[[redirects]]
  from = "/cancellation-refund-policy/"
  to = "/cancellation-refund-policy.html"
  status = 200

# Scorexer redirects completed bookings to this branded, noindex confirmation
# page. Keep /success as a short backwards-compatible alias.
[[redirects]]
  from = "/consultation-confirmed"
  to = "/success.html"
  status = 200
  force = true

[[redirects]]
  from = "/consultation-confirmed/"
  to = "/success.html"
  status = 200
  force = true

[[redirects]]
  from = "/success"
  to = "/success.html"
  status = 200
  force = true

[[redirects]]
  from = "/success/"
  to = "/success.html"
  status = 200
  force = true

# The legacy standalone signer is permanently retired. Proxying the old public
# URL to the retired function preserves an HTTP 410 response at both addresses.
[[redirects]]
  from = "/sign-lpoa.html"
  to = "/.netlify/functions/sign-lpoa"
  status = 200
  force = true

[[redirects]]
  from = "/sign-agreement.html"
  to = "/.netlify/functions/agreement-sign"
  status = 200
  force = true

# The retired Metro 2 download is no longer part of CCC's public method.
# Keep old bookmarks from serving the stale PDF and route them to the current
# on-page credit-report education guide instead.
[[redirects]]
  from = "/downloads/7-Metro2-Dispute-Templates.pdf"
  to = "/freeguide.html"
  status = 301
  force = true

# Retain the legacy page in the release artifact for rollback, but never serve
# its duplicate intake flow. All public traffic uses the canonical homepage.
[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/home.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  # Node 22+ has native WebSocket, which supabase-js RealtimeClient needs.
  # Site was pinned to 20; that forced every createClient() call to supply a
  # `ws` transport or crash (see recovery-blueprint send path).
  NODE_VERSION = "22"
  VITE_AGENTS_API_URL = "https://ccc-agents-api.onrender.com"

[functions]
  node_bundler = "esbuild"
  # PDF.js' server-side layout extraction uses native canvas primitives. Keep
  # this package external so Netlify installs the platform-correct `.node`
  # binary instead of asking esbuild to parse a native module.
  external_node_modules = ["@napi-rs/canvas", "pdfjs-dist"]

[functions."daily-cron"]
  schedule = "0 15 * * *"

# Normal audit progress self-chains one durable checkpoint at a time. This
# scheduled safety net reclaims only expired leases and dispatches missed due
# retries after a platform kill/deploy interruption.
[functions."audit-job-watchdog"]
  schedule = "*/5 * * * *"

# public-affiliate-lookup is public, unauthenticated, and read-only — unlike
# public-intake.cjs (which has its own app-level honeypot + DB-tracked IP
# throttle) this one has no protection at all against being hammered, or
# used to enumerate affiliate ref-code prefixes one character at a time.
[functions."public-affiliate-lookup"]
  [functions."public-affiliate-lookup".rate_limit]
    window = "1m"
    limit = 30

[functions."public-affiliate-application"]
  [functions."public-affiliate-application".rate_limit]
    window = "1m"
    limit = 5

# Public lead capture has a second, persistent pseudonymous 15-minute limit in
# Supabase. This edge cap absorbs bursts before a function instance starts.
[functions."public-intake"]
  [functions."public-intake".rate_limit]
    window = "1m"
    limit = 5

# The premium field guide stays outside the public publish directory and is
# bundled only with its PDF delivery function. Lead capture is owned by
# DisputeFox; this endpoint never creates or updates a CCC CRM record.
[functions."guide-download"]
  included_files = ["netlify/functions/assets/credit-comeback-club-credit-report-field-guide.pdf"]
  [functions."guide-download".rate_limit]
    window = "1m"
    limit = 30

# This unauthenticated legacy callback is tombstoned with HTTP 410. Keep an
# edge cap while old browser bundles age out so it cannot become a noise sink.
[functions."intake-booked"]
  [functions."intake-booked".rate_limit]
    window = "1m"
    limit = 10

# Public and paid. The handler also applies a persistent pseudonymous per-IP
# limit and rejects sensitive data before calling Claude.
[functions."chat-prospect"]
  [functions."chat-prospect".rate_limit]
    window = "1m"
    limit = 10

# Calendly can retry legitimate events, while every request also requires an
# authenticated API verification. Cap anonymous noise without interfering
# with normal booking/cancellation bursts.
[functions."calendly-webhook"]
  [functions."calendly-webhook".rate_limit]
    window = "1m"
    limit = 60

# Paid, staff-authenticated Claude rewrite endpoint. Application-level
# authorization also verifies the staff member can access the client.
[functions."rewrite-dispute-selection"]
  [functions."rewrite-dispute-selection".rate_limit]
    window = "1m"
    limit = 20

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP: allow scripts/styles from self + Supabase + Google Fonts only.
    # 'unsafe-inline' is required for React's inline styles; no eval is allowed.
    # frame-src must allow blob: (client-side PDF preview) and Supabase
    # signed URLs (approved Blueprint PDFs). Without those, Chrome shows
    # "This content is blocked" in the Recovery Blueprint iframe.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://assets.calendly.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; media-src 'self' https:; connect-src 'self' blob: https://pulse.disputeprocess.com https://*.supabase.co https://*.supabase.com https://api.anthropic.com https://generativelanguage.googleapis.com https://ccc-agents-api.onrender.com; frame-src 'self' blob: https://calendly.com https://*.supabase.co https://*.supabase.com; object-src 'self' blob: https://*.supabase.co https://*.supabase.com; form-action 'self' https://pulse.disputeprocess.com https://pulse.scorexer.com; base-uri 'self';"

# The public assistant is intentionally framed only by this same CCC site.
# This specific path overrides the app-wide DENY policy; all other app and
# portal routes remain non-frameable.
[[headers]]
  for = "/widget"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'none';"

# /join is a public, no-auth, no-sensitive-data lead-capture page meant to be
# embedded on affiliate sites (starting with FundHub) — it needs its own,
# more permissive framing policy instead of inheriting the app-wide
# X-Frame-Options: DENY above. frame-ancestors '*' here takes precedence over
# the inherited X-Frame-Options in every modern browser (CSP wins when both
# are present), so DENY never actually applies to this path — no change to
# framing protection anywhere else in the app.
[[headers]]
  for = "/join*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; media-src 'self' https:; connect-src 'self' https://pulse.disputeprocess.com; frame-src 'self'; frame-ancestors *; object-src 'none'; base-uri 'self'; form-action 'self' https://pulse.disputeprocess.com https://pulse.scorexer.com;"
